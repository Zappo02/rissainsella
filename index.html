<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rissa in Sella</title>
<meta name="description" content="Rissa in Sella: gara in moto arcade in 8 tappe italiane. Schiva il traffico, stendi i rivali con ombrelli e padelle e usa il turbo. Gratis dal browser.">
<meta name="theme-color" content="#120f1c">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen game canvas, overlay screens as cards; dark arcade identity (single theme by choice) */
html{color-scheme:dark}
body{margin:0}[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden}
html.embed,html.embed body{height:auto;overflow:hidden}
html.embed #app{position:relative;inset:auto;width:100%}
:root{--bg:#120f1c;--panel:#1c1729;--panel2:#272037;--ink:#fbf3e4;--muted:#b0a6c2;--accent:#ff5a36;--accent2:#ffc93c;--ok:#3ddc84;--sea:#2bb3d9;--line:rgba(255,255,255,.12);--display:Bungee,Impact,'Arial Black',sans-serif;--body:Rubik,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
canvas#game{display:block;background:#000}
.hidden{display:none!important}
#touch{display:none;width:100%;padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;justify-content:space-between;align-items:center}
body.touch #touch{display:flex}
body.touch.land #touch{position:absolute;left:0;right:0;bottom:0;pointer-events:none}
body.touch.land #touch .tb{pointer-events:auto;opacity:.75}
.cluster{display:flex;gap:9px;align-items:center}
.tb{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.32);background:rgba(28,23,41,.88);color:var(--ink);font:900 22px var(--body);display:flex;align-items:center;justify-content:center;touch-action:none;padding:0}
.tb.on{background:var(--accent);border-color:#fff}
.tb.atk{background:rgba(255,90,54,.22);border-color:var(--accent);font-size:13px;flex-direction:column;line-height:1}
.tb.atk span{font-size:22px}
.tb.turbo{border-radius:16px;width:58px;font-size:11px;background:rgba(255,201,60,.18);border-color:var(--accent2);color:var(--accent2);flex-direction:column}
.tb.turbo span{font-size:20px}
.tb.turbo.ready{background:var(--accent2);color:#1c1729;animation:pulse .6s infinite alternate}
.tb.brk{border-radius:16px;width:58px;font-size:11px}
@keyframes pulse{to{transform:scale(1.08)}}
@media (max-width:460px){#touch{padding-left:8px;padding-right:8px;gap:4px}.cluster{gap:6px}.tb{width:52px;height:52px;font-size:18px}.tb.atk span,.tb.turbo span{font-size:18px}.tb.atk{font-size:11px}.tb.turbo,.tb.brk{width:50px;font-size:9.5px}}
#pauseBtn{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(18,15,28,.65);color:var(--ink);font:900 14px var(--body);z-index:5}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,16,.6);z-index:10;padding:16px}
.panel{width:100%;max-width:880px;max-height:100%;overflow:auto;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:20px 20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.panel.sm{max-width:420px;text-align:center}
.panel.md{max-width:560px;text-align:center}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{flex:1 1 300px;min-width:0}
.top{display:flex;gap:8px;margin-left:auto}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.06)}
.langsw button{border:0;background:none;color:var(--muted);font:900 13px var(--body);padding:7px 12px;cursor:pointer}
.langsw button[aria-pressed="true"]{background:var(--accent2);color:#1c1729}
.langsw button:focus-visible,.allgames:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}
.ptop{display:flex;justify-content:flex-end;margin-bottom:6px}
.allgames{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:14px 12px;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font:900 clamp(13px,3.6vw,15px) var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.allgames:hover{filter:brightness(1.08)}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 13px var(--body);cursor:pointer}
.chip:focus-visible,.stage:focus-visible,.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1{font-family:'Bungee Shade',var(--display);font-weight:400;font-size:clamp(34px,7.5vw,60px);line-height:.95;margin:0 0 6px;color:var(--accent2);letter-spacing:.5px;text-wrap:balance}
.eyebrow{font:900 12px var(--body);letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.tag{color:var(--muted);margin:0;font-size:15px;line-height:1.45;max-width:60ch}
.starsTot{margin-top:10px;font:900 14px var(--body);color:var(--accent2)}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:18px}
.stage{position:relative;display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);border-radius:14px;padding:0;cursor:pointer;font-family:var(--body);overflow:hidden;min-width:0;transition:transform .15s,border-color .15s}
.stage:hover:not(:disabled){border-color:var(--accent2);transform:translateY(-2px)}
.stage:disabled{cursor:not-allowed}
.stage .thumb{width:100%;aspect-ratio:16/9;background:#2a2340 center/cover;display:block;position:relative}
.stage:disabled .thumb{filter:grayscale(1) brightness(.45)}
.stage .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}
.stage .num{position:absolute;top:8px;left:8px;font:400 15px var(--display);background:rgba(18,15,28,.75);color:var(--accent2);border-radius:8px;padding:2px 8px}
.stage .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px}
.stage .nm{font-weight:900;font-size:15px}
.stage .meta{font-size:12px;color:var(--muted)}
.stage .st{font-size:14px;letter-spacing:2px;color:var(--accent2)}
.stage .st i{color:rgba(255,255,255,.2);font-style:normal}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:14px;line-height:1.55}
summary{cursor:pointer;color:var(--ink);font-weight:700}
details p{max-width:70ch}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--ink);font:700 12px var(--body);text-align:center}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{flex:1 1 130px;border:0;border-radius:12px;padding:13px 16px;font:900 15px var(--body);cursor:pointer;background:rgba(255,255,255,.08);color:var(--ink)}
.btn.pri{background:var(--accent);color:#fff}
.res-title{font-family:var(--display);font-size:clamp(28px,7vw,44px);margin:2px 0 4px}
.bigstars{font-size:38px;letter-spacing:6px;color:var(--accent2);margin:4px 0}
.bigstars i{color:rgba(255,255,255,.15);font-style:normal}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 16px;text-align:left;margin:12px auto;max-width:360px;font-size:14px;font-variant-numeric:tabular-nums}
.score span:nth-child(even){text-align:right;font-weight:700}
.score .tot{font:900 18px var(--body);color:var(--accent2);border-top:1px solid var(--line);padding-top:6px}
ol.place{margin:8px 0 0;padding:0;list-style:none;font-size:14px;text-align:left;font-variant-numeric:tabular-nums}
ol.place li{display:flex;gap:10px;padding:6px 10px;border-radius:8px}
ol.place li:nth-child(odd){background:rgba(255,255,255,.04)}
ol.place li.me{background:rgba(255,90,54,.2);font-weight:900}
ol.place .p{width:30px;color:var(--accent2);font-weight:900}
ol.place .t{margin-left:auto;color:var(--muted)}
@media (max-width:520px){.stages{grid-template-columns:1fr 1fr;gap:9px}.stage .body{padding:7px 9px 9px}.stage .nm{font-size:13.5px}.panel{padding:16px 14px 18px}}
@media (prefers-reduced-motion:reduce){.tb.turbo.ready{animation:none}.stage{transition:none}}
</style>
</head>
<body>
<div id="app">
<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <div class="cluster">
      <button class="tb" data-k="left" data-i18n-aria="aLeft" aria-label="sinistra">◀</button>
      <button class="tb" data-k="right" data-i18n-aria="aRight" aria-label="destra">▶</button>
    </div>
    <div class="cluster">
      <button class="tb atk" data-k="atkL" data-i18n-aria="aHitL" aria-label="colpo a sinistra"><span>👊</span>◀</button>
      <button class="tb atk" data-k="atkR" data-i18n-aria="aHitR" aria-label="colpo a destra"><span>👊</span>▶</button>
      <button class="tb turbo" data-k="turbo" id="turboBtn"><span>🔥</span><b data-i18n="turboBtn" style="font-weight:inherit">TURBO</b></button>
      <button class="tb brk" data-k="brake" data-i18n="brake">FRENO</button>
    </div>
  </div>
  <button id="pauseBtn" class="hidden" data-i18n-aria="aPause" aria-label="pausa">II</button>
</div>

<div id="home" class="screen">
  <div class="panel">
    <div class="head">
      <div class="brand">
        <div class="eyebrow" data-i18n="eyebrow">Giro d'Italia selvaggio</div>
        <h1 data-i18n="title">RISSA IN SELLA</h1>
        <p class="tag" data-i18n="tagline"></p>
        <div class="starsTot" id="starsTot"></div>
      </div>
      <div class="top"><div class="langsw" role="group" aria-label="Lingua / Language"><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div><button class="chip" id="sndBtn" data-i18n-aria="aSound" aria-label="audio">🔊</button></div>
    </div>
    <div class="stages" id="stages"></div>
    <details>
      <summary data-i18n="howto">Come si gioca</summary>
      <div id="howtoBody"></div>
    </details>
    <a class="allgames" href="https://universosportivo.com/giochi" target="_top" data-i18n="allGames">Tutti i giochi di Universo Sportivo</a>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="panel sm">
    <div class="ptop"><div class="langsw" role="group" aria-label="Lingua / Language"><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div></div>
    <div class="res-title" data-i18n="paused">PAUSA</div>
    <div class="btns">
      <button class="btn pri" id="resumeBtn" data-i18n="resume">Riprendi</button>
      <button class="btn" id="restartBtn" data-i18n="restart">Ricomincia</button>
      <button class="btn" id="homeBtn" data-i18n="home">Tappe</button>
    </div>
  </div>
</div>

<div id="result" class="screen hidden">
  <div class="panel md">
    <div class="ptop"><div class="langsw" role="group" aria-label="Lingua / Language"><button type="button" data-l="it">IT</button><button type="button" data-l="en">EN</button></div></div>
    <div class="eyebrow" id="resStage"></div>
    <div class="res-title" id="resTitle"></div>
    <div class="bigstars" id="resStars"></div>
    <div style="color:var(--muted)" id="resSub"></div>
    <div class="score" id="resScore"></div>
    <ol class="place" id="resList"></ol>
    <div class="btns" id="resBtns"></div>
  </div>
</div>

</div>
<script>
(()=>{
'use strict';
// ================= i18n =================
const T={
 it:{title:'RISSA IN SELLA',eyebrow:"Giro d'Italia selvaggio",tagline:"Otto tappe in moto da nord a sud. Schiva il traffico, colleziona gettoni e stendi i rivali a colpi di ombrello, filone di pane e padella. Il podio sblocca la tappa successiva.",

};
const STORE='rissaInSella_v2';
let save={unlocked:1,best:{},lang:null,mute:false};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(save));}catch(e){}}
let lang=save.lang||((navigator.language||'it').toLowerCase().startsWith('it')?'it':'en');

const ord=n=>lang==='it'?n+'°':n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');

const $=s=>document.querySelector(s);

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
function shade(hex,amt){let n=parseInt(hex.slice(1),16);let r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}

// ================= canvas =================
const EMBED=!window.__NO_EMBED&&(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
if(EMBED)document.documentElement.classList.add('embed');
const APP=$('#app');
function appSize(){if(!EMBED)return[window.innerWidth,window.innerHeight];const w=document.documentElement.clientWidth||window.innerWidth;const h=Math.round(clamp(isTouch?w*1.62:w*1.15,480,900));APP.style.height=h+'px';return[w,h];}
const cvs=$('#game');let ctx=cvs.getContext('2d');
let W=960,H=540,HZ=250,VS=250,UI=1,isTouch=false,isLand=true,VIG=null;

function lastY(){return segs.length?segs[segs.length-1].p2.world.y:0;}
function addSeg(curve,y){const n=segs.length;segs.push({index:n,p1:{world:{y:lastY(),z:n*SEG},camera:{},screen:{}},p2:{world:{y,z:(n+1)*SEG},camera:{},screen:{}},curve,sprites:[],clip:0,cx1:0,cx2:0,loop:0});}
function addRoad(en,ho,le,curve,y){const sY=lastY(),eY=sY+y*SEG,tot=en+ho+le;let i;
 for(i=0;i<en;i++)addSeg(easeIn(0,curve,i/en),easeInOut(sY,eY,i/tot));
 for(i=0;i<ho;i++)addSeg(curve,easeInOut(sY,eY,(en+i)/tot));
 for(i=0;i<le;i++)addSeg(easeInOut(curve,0,i/le),easeInOut(sY,eY,(en+ho+i)/tot));}
function buildTrack(st){

 addRoad(0,90,0,0,0);

function updateRivals(dt,pz){
 const racing=G.state==='race';
 const lanes=L.oncoming>0?[-0.45,0.15,0.45,0.72]:[-0.7,-0.25,0.25,0.7];
 for(const r of G.rivals){
  r.flash=Math.max(0,r.flash-dt);r.swing=Math.max(0,r.swing-dt);if(r.bargeT)r.bargeT=Math.max(0,r.bargeT-dt);
  if(r.say){r.say.t-=dt;if(r.say.t<=0)r.say=null;}
  if(r.fallT>0){r.fallT-=dt;r.speed=Math.max(0,r.speed-MAXS*1.6*dt);r.z+=r.speed*dt;if(r.fallT<=0){r.hp=r.maxHp*0.6;r.speed=0;r.x=clamp(r.x,-0.8,0.8);}continue;}
  const gap=r.z-pz;
  let tgt=r.base*MAXS;
  if(!r.finished){if(gap<-1500)tgt*=1.1;else if(gap<-400)tgt*=1.05;else if(gap>5000)tgt*=0.96;}else tgt=MAXS*0.45;
  if(r.hitSlow>0){r.hitSlow-=dt;tgt*=0.75;}
  const ps=findSeg(r.z);tgt*=1-Math.min(0.12,Math.abs(ps.curve)*0.02);
  if(Math.abs(r.x)>1)tgt*=0.5;
  r.speed+=clamp(tgt-r.speed,-MAXS*dt,ACC*1.1*dt);r.speed=Math.min(r.speed,MAXS*0.99);
  r.thinkT-=dt;
  if(r.thinkT<=0){
   r.thinkT=0.25;let best=r.lane,bs=-1e9;
   for(const cand of [r.lane,...lanes]){let md=99999;for(const c of G.cars){const dz=c.z-r.z;const range=c.dir>0?2600:5200;if(dz>-150&&dz<range&&Math.abs(c.x-cand)<0.38&&(c.dir<0||r.speed>c.speed))md=Math.min(md,dz);}
    const sc=md-(cand===r.lane?0:300)-Math.abs(cand-r.x)*200;if(sc>bs){bs=sc;best=cand;}}
   r.lane=best;
  }
  let tx=r.lane;
  if(racing&&!r.finished&&Math.abs(gap)<700&&r.aggro>0.3&&G.turboT<=0){const side=r.x<G.playerX?-1:1;tx=G.playerX+side*0.2;}
  r.x+=clamp(tx-r.x,-1.3*dt,1.3*dt);r.x=clamp(r.x,-1.6,1.6);
  r.z+=r.speed*dt;
  if(Math.abs(r.x)>1.12&&r.speed>MAXS*0.45){r.fallT=3;r.fallSide=r.x>0?1:-1;r.speed*=0.3;if(Math.abs(gap)<3000){G.kos++;addAdr(20);popFx(r.sx,r.sy-r.sw*1.4,'+100','#3ddc84',20);}continue;}
  for(const c of G.cars){if(Math.abs(c.z-r.z)<200&&Math.abs(c.x-r.x)<(c.ww/ROADW/2*0.9+0.05)&&(c.dir<0||r.speed>c.speed)){r.fallT=3;r.fallSide=c.x<r.x?1:-1;r.speed*=0.3;if(Math.abs(gap)<3000&&r.bargeT>0){G.kos++;addAdr(20);}break;}}
  if(r.fallT>0)continue;
  // overtaken taunt
  const ahead=gap>0;if(r.wasAhead&&!ahead&&racing&&Math.abs(r.x-G.playerX)<0.8)say(r,'pass');r.wasAhead=ahead;
  r.cd-=dt;
  if(racing&&!r.finished&&G.invT<=0&&G.turboT<=0&&r.cd<=0&&Math.abs(gap)<240){
   const dx=G.playerX-r.x,w=WEAP[r.weapon];
   if(Math.abs(dx)>0.04&&Math.abs(dx)<w.reach&&Math.random()<r.aggro*dt*2.5){
    r.swing=0.3;r.swingSide=dx>0?1:-1;r.cd=w.cd*3+Math.random()*0.8;sfx('swing');
    hitPlayer(w.dmg*L.dmg*(r.boss?1.3:1)*(0.8+Math.random()*0.4),r.swingSide,r);
   }
  }
  if(!r.finished&&r.z>=finishZ){r.finished=true;G.finishOrder.push(r);r.time=G.raceT;}
 }
}

 if(!paused&&G){accT+=dt;let k=0;while(accT>=STEP&&k<6){update(STEP);accT-=STEP;k++;}if(k>=6)accT=0;}

const THUMBS=[];
function makeThumb(i){
 const snap={segs,trackLen,finishZ,finishIdx,L,TH,BG,G,LV,mode,ctx,W,H,HZ,VS,UI,CLOUD};
 const c=document.createElement('canvas');c.width=480;c.height=270;
 ctx=c.getContext('2d');W=480;H=270;HZ=Math.round(270*0.46);VS=270*0.94-HZ;UI=1;
 newGame(i);mode='thumb';G.state='demo';
 G.position=SEG*(160+i*23);G.speed=MAXS*0.8;G.playerX=0.1;G.lean=0.2;G.time=1;
 const pz=G.position+PLAYERZ;
 G.rivals.forEach((r,k)=>{r.z=pz+300+k*420;r.x=[0.45,-0.35,0.2,-0.6,0.6,-0.1,0.3][k];if(k===0){r.swing=0.15;r.swingSide=-1;}});
 G.rivals[0].weapon=i>4?'pan':'umbrella';G.weapon=['umbrella','bread','broom','pan'][i%4];G.swing=0.15;G.swingSide=1;
 G.cars.forEach((cc,k)=>{cc.z=pz+2500+k*2600;});
 render({noVig:true});
 const url=c.toDataURL('image/jpeg',0.82);
 ({segs,trackLen,finishZ,finishIdx,L,TH,BG,G,LV,mode,ctx,W,H,HZ,VS,UI,CLOUD}=snap);
 return url;
}
function buildThumbs(){let i=0;const step=()=>{if(i>=STAGES.length)return;THUMBS[i]=makeThumb(i);const el=document.querySelector(`.stage[data-i="${i}"] .thumb`);if(el)el.style.backgroundImage=`url(${THUMBS[i]})`;i++;setTimeout(step,30);};step();}

// ================= UI =================
let lastResult=null;
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t(el.dataset.i18n);if(v)el.textContent=v;});
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
 document.querySelectorAll('.langsw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
 $('#howtoBody').innerHTML=t('howtoHtml');
 document.title=lang==='it'?'Rissa in Sella':'Saddle Brawl';
 for(const n of [startIdx,finishIdx]){const sg=segs[n];if(sg)sg.sprites.forEach(sp=>{if(sp.gantry)sp.spr.img=gantryImg(t(sp.gantry));});}
 renderStages();
 if(lastResult&&!$('#result').classList.contains('hidden'))showResult(lastResult.finished);
}
function setLang(l){if(l===lang)return;lang=l;save.lang=l;persist();applyLang();}
document.querySelectorAll('.langsw button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
const starStr=n=>'★'.repeat(n)+'<i>'+'★'.repeat(3-n)+'</i>';
function renderStages(){
 const box=$('#stages');box.innerHTML='';let tot=0;
 STAGES.forEach((st,i)=>{
  const locked=i+1>save.unlocked;const b=save.best[i];tot+=b&&b.stars||0;
  const el=document.createElement('button');el.className='stage';el.disabled=locked;el.dataset.i=i;
  const meta=locked?t('locked'):`${t('diff')[i]} · ${b&&b.pos?t('best')+' '+ord(b.pos)+' · '+fmtT(b.time):t('noBest')}`;
  el.innerHTML=`<span class="thumb" style="${THUMBS[i]?`background-image:url(${THUMBS[i]})`:''}">${locked?'<span class="lock">🔒</span>':''}<span class="num">${i+1}</span></span><span class="body"><span class="nm">${t('stages')[i]}</span><span class="st">${starStr(b&&b.stars||0)}</span><span class="meta">${meta}</span></span>`;
  el.onclick=()=>{initAudio();startRace(i);};
  box.appendChild(el);
 });
 $('#starsTot').textContent=`★ ${nf(tot)} / ${nf(STAGES.length*3)} ${t('stars')}`;
}
function show(id){['home','pause','result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));$('#pauseBtn').classList.toggle('hidden',id!==null||mode!=='race');}
function startRace(i){newGame(i);mode='race';paused=false;show(null);$('#pauseBtn').classList.remove('hidden');for(const k in keys)keys[k]=false;}
function goHome(){paused=false;newDemo(Math.min(save.unlocked-1,STAGES.length-1));show('home');renderStages();}
function togglePause(){if(mode!=='race')return;paused=!paused;show(paused?'pause':null);if(!paused)$('#pauseBtn').classList.remove('hidden');}
function showResult(finished){
 lastResult={finished};
 const title=$('#resTitle');$('#resStage').textContent=t('stage')+' '+(LV+1)+' · '+t('stages')[LV];
 if(!finished){title.textContent=t('dnf');title.style.color='#ff5a36';$('#resSub').textContent=t('dnfSub');}
 else if(G.place===1){title.textContent=t('win');title.style.color='#ffc93c';$('#resSub').textContent=LV===STAGES.length-1?t('lastWin'):t('winSub');}
 else{title.textContent=ord(G.place)+t('place');title.style.color='#fbf3e4';$('#resSub').textContent=G.place<=3?t('podSub'):t('loseSub');}
 $('#resStars').innerHTML=starStr(G.stars);
 const rows=[[t('time'),finished?fmtT(G.raceT):'—'],[t('posB'),nf(finished?POSB[G.place-1]:0)],[t('kos')+' ×100',nf(G.kos*100)],[t('coins')+' ×10',nf(G.coins*10)],[t('nears')+' ×25',nf(G.nears*25)]];
 $('#resScore').innerHTML=rows.map(([a,b])=>`<span>${a}</span><span>${b}</span>`).join('')+`<span class="tot">${t('total')}</span><span class="tot">${nf(G.score)}</span>`;
 const order=G.finishOrder.slice();const rest=G.rivals.filter(r=>!r.finished).sort((a,b)=>b.z-a.z);
 if(!finished){rest.forEach(r=>order.push(r));order.push('me');}else rest.forEach(r=>order.push(r));
 $('#resList').innerHTML=order.map((r,i)=>r==='me'?`<li class="me"><span class="p">${finished?ord(i+1):'—'}</span><span>${t('you')}</span><span class="t">${finished?fmtT(G.raceT):t('out')}</span></li>`:`<li><span class="p">${ord(i+1)}</span><span style="color:${r.jacket}">●</span><span>${r.name}</span><span class="t">${r.finished?fmtT(r.time):''}</span></li>`).join('');
 const bx=$('#resBtns');bx.innerHTML='';
 const mkB=(txt,cls,fn)=>{const b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.textContent=txt;b.onclick=fn;bx.appendChild(b);};
 const canNext=finished&&G.place<=3&&LV<STAGES.length-1;
 if(canNext)mkB(t('next'),'pri',()=>startRace(LV+1));
 mkB(t('retry'),canNext?'':'pri',()=>startRace(LV));
 mkB(t('home'),'',goHome);
 show('result');
}
$('#sndBtn').onclick=()=>{initAudio();save.mute=!save.mute;persist();$('#sndBtn').textContent=save.mute?'🔇':'🔊';};
$('#sndBtn').textContent=save.mute?'🔇':'🔊';
$('#resumeBtn').onclick=togglePause;
$('#restartBtn').onclick=()=>startRace(LV);
$('#homeBtn').onclick=goHome;
$('#pauseBtn').onclick=togglePause;

// ================= boot =================
resize();buildSprites();applyLang();newDemo(Math.min(save.unlocked-1,STAGES.length-1));show('home');
let thumbsDone=false;
const afterFonts=()=>{if(thumbsDone)return;thumbsDone=true;buildSprites();if(mode==='demo')newDemo(Math.min(save.unlocked-1,STAGES.length-1));buildThumbs();};
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(afterFonts);setTimeout(afterFonts,2500);}else afterFonts();
requestAnimationFrame(frame);
if(EMBED){const sendH=()=>{try{window.parent.postMessage({type:'rissa-in-sella-height',height:Math.ceil(document.documentElement.getBoundingClientRect().height)},'*');}catch(e){}};
 if('ResizeObserver' in window)new ResizeObserver(sendH).observe(document.documentElement);window.addEventListener('load',sendH);sendH();}
window.__dbg={get G(){return G;},startRace,keys,playerAttack,fireTurbo,step:(n)=>{for(let i=0;i<n&&mode!=='over';i++)update(STEP);},get mode(){return mode;},findSeg:z=>findSeg(z),unlockAll:()=>{save.unlocked=8;renderStages();}};
})();
</script>
</body>
</html>
